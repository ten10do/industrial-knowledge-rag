version: 2

updates:
  # Python has generated Linux/Windows locks and is updated through pip-tools.
  # Repository-level Dependabot alerts and security updates remain enabled.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"
